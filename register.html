<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Planner — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dim:rgba(255,255,255,.78);--dim2:rgba(255,255,255,.5);--glass-brd:rgba(255,255,255,.42)}
html,body{height:100%;font-family:'Sora',sans-serif;color:#fff}
body{min-height:100vh;position:relative;overflow-x:hidden;
  background:radial-gradient(1100px 750px at 14% 18%, rgba(255,255,255,.14), transparent 60%),
    radial-gradient(900px 700px at 88% 82%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(150deg,#052a70 0%,#0a5fdb 32%,#189be6 66%,#5fe0f2 100%);
  background-attachment:fixed;}
.blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;animation:blobPulse 7s ease-in-out infinite alternate}
@keyframes blobPulse{from{opacity:.55;transform:scale(1)}to{opacity:.85;transform:scale(1.12)}}
.scene{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{width:460px;max-width:100%;position:relative;overflow:hidden;
  background:linear-gradient(165deg, rgba(255,255,255,.24), rgba(255,255,255,.07));
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--glass-brd);border-radius:30px;padding:44px 40px 38px;
  box-shadow:0 35px 90px rgba(2,16,60,.45), inset 0 1px 0 rgba(255,255,255,.55);}
.brand-icon{width:54px;height:54px;border-radius:16px;margin:0 auto 18px;
  background:linear-gradient(135deg, rgba(255,255,255,.4), rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(2,20,70,.3), inset 0 1px 0 rgba(255,255,255,.5)}
.brand-icon svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1.title{font-size:28px;font-weight:800;text-align:center;letter-spacing:2.6px;margin-bottom:6px}
.subtitle{text-align:center;font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--dim);margin-bottom:26px;font-weight:600}
.alert{background:rgba(255,80,80,.18);border:1px solid rgba(255,140,140,.5);border-radius:14px;padding:12px 16px;font-size:13px;color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.alert-dot{width:19px;height:19px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.field{margin-bottom:15px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
input,select{width:100%;padding:13px 16px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);
  border-radius:14px;color:#fff;font-size:13.5px;font-family:'Sora',sans-serif;outline:none;transition:.2s;color-scheme:dark}
input::placeholder{color:rgba(255,255,255,.62)}
input:focus,select:focus{background:rgba(255,255,255,.2);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
select option{background:#0a5fdb;color:#fff}
.btn{width:100%;padding:15px;border:none;border-radius:999px;background:linear-gradient(135deg,#eafcff,#9fe3ff);
  color:#063a7a;font-weight:800;font-size:14px;letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;margin-top:8px;
  box-shadow:0 16px 36px rgba(2,20,70,.4);transition:.2s;font-family:'Sora',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 44px rgba(2,20,70,.5)}
.foot{text-align:center;font-size:13px;color:var(--dim);margin-top:18px}
.foot a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:1px}
.hint{font-size:11px;color:var(--dim2);margin-top:5px;line-height:1.5}
</style>
</head>
<body>
<div class="blob" style="width:520px;height:520px;top:-160px;left:-160px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)"></div>
<div class="blob" style="width:460px;height:460px;bottom:-180px;right:-140px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);animation-delay:1.5s"></div>

<div class="scene">
  <div class="card">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </div>
    <h1 class="title">SIGN UP</h1>
    <div class="subtitle">Create your Student Planner account</div>

    <div id="alertBox"></div>

    <form id="regForm">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="e.g. Juan Dela Cruz" required>
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Choose a password" required>
      </div>
      <div class="field">
        <label>I am a...</label>
        <select id="role">
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
        <div class="hint">The very first account ever registered on this device is auto-approved as admin. Everyone else needs approval from an admin before they can sign in.</div>
      </div>
      <button class="btn" type="submit">
        Create Account
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#063a7a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="foot">Already have an account? <a href="login.html">Sign In</a></div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
if (SP.currentUser()) location.href = 'index.html';
const alertBox = document.getElementById('alertBox');
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const role = document.getElementById('role').value;
  if (!name || !username || !password) {
    alertBox.innerHTML = '<div class="alert"><div class="alert-dot">!</div><span>Please fill in all fields.</span></div>';
    return;
  }
  const res = SP.register({ name, username, password, role });
  if (!res.ok) {
    alertBox.innerHTML = `<div class="alert"><div class="alert-dot">!</div><span>${res.msg}</span></div>`;
    return;
  }
  location.href = 'login.html?registered=1' + (res.autoApproved ? '' : '&pending=1');
});
</script>
</body>
</html>
